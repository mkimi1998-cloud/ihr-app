name: EAS OTA Update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/App.js'
      - '**/src/**'

jobs:
  ota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project folder
        run: |
          P=$(find . -name package.json -not -path '*/node_modules/*' | head -1)
          echo "APP_DIR=$(dirname "$P")" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install packages & expo-updates
        run: |
          npm install --legacy-peer-deps
          npx expo install expo-updates
        working-directory: ${{ env.APP_DIR }}

      - name: Publish OTA Update to EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest update --platform android --channel production --message "${{ github.event.head_commit.message || format('OTA Update Run {0}', github.run_number) }}" --non-interactive
        working-directory: ${{ env.APP_DIR }}

