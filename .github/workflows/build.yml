name: Build iHR (Android & iOS App Store IPA)
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Platform to build (all, android, ios)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - android
          - ios
      macos_runner:
        description: "macOS runner label for iOS build"
        required: true
        default: "macos-14"
        type: choice
        options:
          - macos-14
          - macos-15
          - macos-latest
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  android:
    name: Build Android (APK)
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'android' || github.event.inputs.target == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Locate project folder and set build number
        env:
          BUILD_NUM: ${{ github.run_number }}
        run: |
          P=$(find . -name package.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$P" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting $ZIP_FILE..."
              unzip -o "$ZIP_FILE" -d ./extracted_ihr
              P=$(find ./extracted_ihr -name package.json -not -path '*/node_modules/*' | head -1)
            fi
          fi
          [ -z "$P" ] && { echo "No package.json found in repo. Files:"; ls -R | head -50; exit 1; }
          export APP_DIR=$(dirname "$P")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Project folder: $APP_DIR"
          node -e '
            const fs = require("fs");
            const p = process.env.APP_DIR + "/app.json";
            const cfg = JSON.parse(fs.readFileSync(p, "utf8"));
            cfg.expo = cfg.expo || {};
            cfg.expo.android = cfg.expo.android || {};
            cfg.expo.android.package = cfg.expo.android.package || "my.gov.mtib.ihr";
            cfg.expo.android.versionCode = Number(process.env.BUILD_NUM) || 9;
            cfg.expo.ios = cfg.expo.ios || {};
            cfg.expo.ios.bundleIdentifier = "my.gov.mtib.ihr";
            cfg.expo.ios.buildNumber = String(process.env.BUILD_NUM || "9");
            cfg.expo.ios.supportsTablet = true;
            cfg.expo.ios.infoPlist = Object.assign({
              NSCameraUsageDescription: "Benarkan iHR mengakses kamera untuk imbasan kod QR dan gambar kehadiran.",
              NSLocationWhenInUseUsageDescription: "Benarkan iHR menggunakan lokasi anda untuk geotagging kehadiran.",
              NSPhotoLibraryUsageDescription: "Benarkan iHR mengakses galeri untuk memuat naik kod QR.",
              ITSAppUsesNonExemptEncryption: false
            }, cfg.expo.ios.infoPlist || {});
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + "\n");
            console.log("Updated app.json with ios.bundleIdentifier =", cfg.expo.ios.bundleIdentifier);
          '

      - name: Strip invisible characters from JS files
        run: |
          node -e '
            const fs = require("fs");
            const files = ["App.js", "src/api.js", "src/theme.js"];
            for (const f of files) {
              if (fs.existsSync(f)) {
                const raw = fs.readFileSync(f, "utf8");
                const clean = raw.replace(/[\u200B-\u200D\uFEFF\u00A0]/g, (m) => m === "\u00A0" ? " " : "");
                fs.writeFileSync(f, clean, "utf8");
                console.log("Cleaned:", f);
              }
            }
          '
        working-directory: ${{ env.APP_DIR }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: |
          npm install --legacy-peer-deps
          npx expo install expo-updates
        working-directory: ${{ env.APP_DIR }}

      - name: Generate Android project
        env:
          EXPO_UPDATES_CHANNEL: production
        run: npx expo prebuild --platform android --no-install
        working-directory: ${{ env.APP_DIR }}

      - name: Fix missing splash color
        run: |
          F=android/app/src/main/res/values/colors.xml
          mkdir -p "$(dirname "$F")"
          [ -f "$F" ] || printf '<resources>\n</resources>\n' > "$F"
          grep -q splashscreen_background "$F" || sed -i 's|</resources>|  <color name="splashscreen_background">#FFFFFF</color>\n</resources>|' "$F"
          cat "$F"
        working-directory: ${{ env.APP_DIR }}

      - name: Point Gradle at the SDK and harden downloads
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          {
            echo "systemProp.org.gradle.internal.http.connectionTimeout=180000"
            echo "systemProp.org.gradle.internal.http.socketTimeout=180000"
            echo "systemProp.org.gradle.internal.repository.max.retries=8"
            echo "systemProp.org.gradle.internal.repository.initial.backoff=2000"
          } >> android/gradle.properties
        working-directory: ${{ env.APP_DIR }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-npm-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: gradle-npm-${{ runner.os }}-

      - name: Build APK (retries on network errors)
        run: |
          chmod +x gradlew
          n=0
          until ./gradlew assembleRelease --no-daemon; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "Build failed after $n tries"; exit 1; fi
            echo "Retrying in 30s (try $((n+1)) of 3)..."; sleep 30
          done
        working-directory: ${{ env.APP_DIR }}/android

      - name: Prepare Release APK
        run: |
          mkdir -p release-artifacts
          APK_SRC=$(find "${{ env.APP_DIR }}/android/app/build/outputs/apk/release" -name "*.apk" | head -1)
          [ -z "$APK_SRC" ] && { echo "No release APK found!"; exit 1; }
          cp "$APK_SRC" "release-artifacts/iHR-v1.1.0-${{ github.run_number }}.apk"
          ls -lh release-artifacts/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iHR-v1.1.0-${{ github.run_number }}-android-apk
          path: release-artifacts/iHR-v1.1.0-${{ github.run_number }}.apk

      - name: Publish Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.1.0-${{ github.run_number }}"
          name: "iHR Release v1.1.0 #${{ github.run_number }}"
          body: "iHR v1.1.0 Release (Android APK & iOS IPA)."
          draft: false
          prerelease: false
          files: |
            release-artifacts/iHR-v1.1.0-${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios:
    name: Build iOS App Store IPA
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'ios' || github.event.inputs.target == '' }}
    runs-on: ${{ github.event.inputs.macos_runner || 'macos-14' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Locate project folder and set build number
        env:
          BUILD_NUM: ${{ github.run_number }}
        run: |
          P=$(find . -name package.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$P" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting $ZIP_FILE..."
              unzip -o "$ZIP_FILE" -d ./extracted_ihr
              P=$(find ./extracted_ihr -name package.json -not -path '*/node_modules/*' | head -1)
            fi
          fi
          [ -z "$P" ] && { echo "No package.json found in repo. Files:"; ls -R | head -50; exit 1; }
          export APP_DIR=$(dirname "$P")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Project folder: $APP_DIR"
          node -e '
            const fs = require("fs");
            const p = process.env.APP_DIR + "/app.json";
            const cfg = JSON.parse(fs.readFileSync(p, "utf8"));
            cfg.expo = cfg.expo || {};
            cfg.expo.android = cfg.expo.android || {};
            cfg.expo.android.package = cfg.expo.android.package || "my.gov.mtib.ihr";
            cfg.expo.android.versionCode = Number(process.env.BUILD_NUM) || 9;
            cfg.expo.ios = cfg.expo.ios || {};
            cfg.expo.ios.bundleIdentifier = "my.gov.mtib.ihr";
            cfg.expo.ios.buildNumber = String(process.env.BUILD_NUM || "9");
            cfg.expo.ios.supportsTablet = true;
            cfg.expo.ios.infoPlist = Object.assign({
              NSCameraUsageDescription: "Benarkan iHR mengakses kamera untuk imbasan kod QR dan gambar kehadiran.",
              NSLocationWhenInUseUsageDescription: "Benarkan iHR menggunakan lokasi anda untuk geotagging kehadiran.",
              NSPhotoLibraryUsageDescription: "Benarkan iHR mengakses galeri untuk memuat naik kod QR.",
              ITSAppUsesNonExemptEncryption: false
            }, cfg.expo.ios.infoPlist || {});
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + "\n");
            console.log("Updated app.json with ios.bundleIdentifier =", cfg.expo.ios.bundleIdentifier);
          '

      - name: Strip invisible characters from JS files
        run: |
          node -e '
            const fs = require("fs");
            const files = ["App.js", "src/api.js", "src/theme.js"];
            for (const f of files) {
              if (fs.existsSync(f)) {
                const raw = fs.readFileSync(f, "utf8");
                const clean = raw.replace(/[\u200B-\u200D\uFEFF\u00A0]/g, (m) => m === "\u00A0" ? " " : "");
                fs.writeFileSync(f, clean, "utf8");
                console.log("Cleaned:", f);
              }
            }
          '
        working-directory: ${{ env.APP_DIR }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/Library/Caches/CocoaPods
          key: ios-npm-pods-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: ios-npm-pods-${{ runner.os }}-

      - name: Install packages
        run: |
          npm install --legacy-peer-deps
          npx expo install expo-updates
        working-directory: ${{ env.APP_DIR }}

      - name: Generate iOS project
        env:
          EXPO_UPDATES_CHANNEL: production
        run: npx expo prebuild --platform ios --no-install
        working-directory: ${{ env.APP_DIR }}

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update
        working-directory: ${{ env.APP_DIR }}

      - name: Configure Apple App Store Signing Certificate & Provisioning Profile
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "$IOS_P12_BASE64" ] && [ -n "$IOS_PROVISION_BASE64" ]; then
            echo "Configuring Apple Distribution Certificate & App Store Provisioning Profile..."
            KC_PASS="${KEYCHAIN_PASSWORD:-ihr_build_kc_pass}"
            KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
            CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
            PP_PATH="$RUNNER_TEMP/profile.mobileprovision"

            echo "$IOS_P12_BASE64" | base64 --decode > "$CERT_PATH"
            echo "$IOS_PROVISION_BASE64" | base64 --decode > "$PP_PATH"

            security create-keychain -p "$KC_PASS" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KC_PASS" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN_PATH"

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
            TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
            cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID.mobileprovision"

            echo "IOS_SIGNED=true" >> "$GITHUB_ENV"
            echo "IOS_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
            echo "IOS_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
            echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
            echo "Loaded Provisioning Profile: $PROFILE_NAME ($UUID) for Team $TEAM_ID"
          else
            echo "Apple signing secrets not set — exporting unsigned .ipa."
            echo "IOS_SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Archive & Export iOS App Store IPA
        run: |
          cd ios
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          mkdir -p build

          if [ "$IOS_SIGNED" = "true" ]; then
            cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$IOS_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>my.gov.mtib.ihr</key>
              <string>$IOS_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

            xcodebuild -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$PWD/build/iHR.xcarchive" \
              DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
              archive

            xcodebuild -exportArchive \
              -archivePath "$PWD/build/iHR.xcarchive" \
              -exportOptionsPlist "$PWD/build/ExportOptions.plist" \
              -exportPath "$PWD/build/ipa"
          else
            xcodebuild -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$PWD/build/iHR.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive

            mkdir -p "$PWD/build/ipa" "$PWD/build/Payload"
            cp -R "$PWD/build/iHR.xcarchive/Products/Applications/"*.app "$PWD/build/Payload/"
            cd "$PWD/build"
            zip -r "ipa/iHR-unsigned.ipa" Payload
          fi
        working-directory: ${{ env.APP_DIR }}

      - name: Prepare Release IPA
        run: |
          mkdir -p release-artifacts
          IPA_SRC=$(find "${{ env.APP_DIR }}/ios/build/ipa" -name "*.ipa" | head -1)
          [ -z "$IPA_SRC" ] && { echo "No release IPA found!"; exit 1; }
          cp "$IPA_SRC" "release-artifacts/iHR-v1.1.0-${{ github.run_number }}.ipa"
          ls -lh release-artifacts/

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iHR-v1.1.0-${{ github.run_number }}-ios-ipa
          path: release-artifacts/iHR-v1.1.0-${{ github.run_number }}.ipa

      - name: Publish iOS IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.1.0-${{ github.run_number }}"
          name: "iHR Release v1.1.0 #${{ github.run_number }}"
          body: "iHR v1.1.0 Release (Android APK & iOS IPA)."
          draft: false
          prerelease: false
          files: |
            release-artifacts/iHR-v1.1.0-${{ github.run_number }}.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
