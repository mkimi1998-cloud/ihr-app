      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        run: npm install --legacy-peer-deps
        working-directory: app
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: app
      - name: Fix missing splash color
        run: |
          F=android/app/src/main/res/values/colors.xml
          mkdir -p "$(dirname "$F")"
          [ -f "$F" ] || printf '<resources>\n</resources>\n' > "$F"
          grep -q splashscreen_background "$F" || sed -i 's|</resources>|  <color name="splashscreen_background">#FFFFFF</color>\n</resources>|' "$F"
          cat "$F"
        working-directory: app
      - name: Point Gradle at the SDK and harden downloads
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          {
            echo "systemProp.org.gradle.internal.http.connectionTimeout=180000"
            echo "systemProp.org.gradle.internal.http.socketTimeout=180000"
            echo "systemProp.org.gradle.internal.repository.max.retries=8"
            echo "systemProp.org.gradle.internal.repository.initial.backoff=2000"
          } >> android/gradle.properties
        working-directory: app
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-npm-${{ runner.os }}-${{ hashFiles('app/package.json') }}
          restore-keys: gradle-npm-${{ runner.os }}-
      - name: Build APK (retries on network errors)
        run: |
          chmod +x gradlew
          n=0
          until ./gradlew assembleRelease --no-daemon; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "Build failed after $n tries"; exit 1; fi
            echo "Retrying in 30s (try $((n+1)) of 3)..."; sleep 30
          done
        working-directory: app/android
      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.1.0-${{ github.run_number }}"
          name: "iHR APK Build v1.1.0 #${{ github.run_number }}"
          body: "Update Patch: Warna Tema Dropdown (Merah Bata, Biru Diraja, Hijau Hutan, Kayu Jati, Ungu Diraja), QR Scan Vibration, Pull-to-Refresh, and Dynamic Year Filter."
          draft: false
          prerelease: false
          files: app/android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
