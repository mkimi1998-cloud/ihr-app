name: Build iHR (Android APK & iOS App Store IPA)
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    name: Build Android (APK)
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'android' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Locate project folder and set build number
        env:
          BUILD_NUM: ${{ github.run_number }}
        run: |
          P=$(find . -name package.json -not -path '*/node_modules/*' | head -1)
          [ -z "$P" ] && { echo "No package.json found in repo. Files:"; ls -R | head -50; exit 1; }
          APP_DIR=$(dirname "$P")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Project folder: $APP_DIR"
          sed -i "s/\"versionCode\": [0-9]*/\"versionCode\": $BUILD_NUM/" "$APP_DIR/app.json"
          echo "$IOS_P12_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/raw_cert.p12"
            echo "$IOS_PROVISION_BASE64" | tr -d '\r\n ' | base64 --decode > "$PP_PATH"

            # Re-wrap modern Windows AES-256 PFX into legacy 3DES PKCS12 so macOS security import decodes it cleanly
            openssl pkcs12 -in "$RUNNER_TEMP/raw_cert.p12" -out "$RUNNER_TEMP/cert_bundle.pem" -nodes -passin "pass:$IOS_P12_PASSWORD" -legacy || \
            openssl pkcs12 -in "$RUNNER_TEMP/raw_cert.p12" -out "$RUNNER_TEMP/cert_bundle.pem" -nodes -passin "pass:$IOS_P12_PASSWORD"
            openssl pkcs12 -export -in "$RUNNER_TEMP/cert_bundle.pem" -out "$CERTIFICATE_PATH" -passout "pass:$IOS_P12_PASSWORD" -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1

      - name: Strip invisible characters from JS files
        run: |
          node -e '
            const fs = require("fs");
            const files = ["App.js", "src/api.js", "src/theme.js"];
            for (const f of files) {
              if (fs.existsSync(f)) {
                const raw = fs.readFileSync(f, "utf8");
                const clean = raw.replace(/[\u200B-\u200D\uFEFF\u00A0]/g, (m) => m === "\u00A0" ? " " : "");
                fs.writeFileSync(f, clean, "utf8");
                console.log("Cleaned:", f);
              }
            }
          '
        working-directory: ${{ env.APP_DIR }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: |
          npm install --legacy-peer-deps
          npx expo install expo-updates
        working-directory: ${{ env.APP_DIR }}

      - name: Generate Android project
        env:
          EXPO_UPDATES_CHANNEL: production
        run: npx expo prebuild --platform android --no-install
        working-directory: ${{ env.APP_DIR }}

      - name: Fix missing splash color
        run: |
          F=android/app/src/main/res/values/colors.xml
          mkdir -p "$(dirname "$F")"
          [ -f "$F" ] || printf '<resources>\n</resources>\n' > "$F"
          grep -q splashscreen_background "$F" || sed -i 's|</resources>|  <color name="splashscreen_background">#FFFFFF</color>\n</resources>|' "$F"
          cat "$F"
        working-directory: ${{ env.APP_DIR }}

      - name: Point Gradle at the SDK and harden downloads
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          {
            echo "systemProp.org.gradle.internal.http.connectionTimeout=180000"
            echo "systemProp.org.gradle.internal.http.socketTimeout=180000"
            echo "systemProp.org.gradle.internal.repository.max.retries=8"
            echo "systemProp.org.gradle.internal.repository.initial.backoff=2000"
          } >> android/gradle.properties
        working-directory: ${{ env.APP_DIR }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-npm-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: gradle-npm-${{ runner.os }}-

      - name: Build APK (retries on network errors)
        run: |
          chmod +x gradlew
          n=0
          until ./gradlew assembleRelease --no-daemon; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "Build failed after $n tries"; exit 1; fi
            echo "Retrying in 30s (try $((n+1)) of 3)..."; sleep 30
          done
        working-directory: ${{ env.APP_DIR }}/android

      - name: Publish EAS OTA Update
        if: env.EXPO_TOKEN != ''
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest update --platform android --channel production --message "OTA Build ${{ github.run_number }}" --non-interactive
        working-directory: ${{ env.APP_DIR }}

      - name: Rename Release APK
        run: |
          mkdir -p release-apk
          APK_SRC=$(find "${{ env.APP_DIR }}/android/app/build/outputs/apk/release" -name "*.apk" | head -1)
          [ -z "$APK_SRC" ] && { echo "No release APK found!"; exit 1; }
          cp "$APK_SRC" "release-apk/iHR-v1.1.0-${{ github.run_number }}.apk"
          ls -lh release-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iHR-v1.1.0-${{ github.run_number }}.apk
          path: release-apk/iHR-v1.1.0-${{ github.run_number }}.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.1.0-${{ github.run_number }}"
          name: "iHR Build v1.1.0 #${{ github.run_number }}"
          body: "iHR Build v1.1.0: Android APK & iOS App Store IPA."
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-apk/iHR-v1.1.0-${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios:
    name: Build iOS App Store IPA
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'ios' || github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Locate project folder and set iOS build number
        env:
          BUILD_NUM: ${{ github.run_number }}
        run: |
          P=$(find . -name package.json -not -path '*/node_modules/*' | head -1)
          [ -z "$P" ] && { echo "No package.json found in repo."; exit 1; }
          APP_DIR=$(dirname "$P")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Project folder: $APP_DIR"
          sed -i '' "s/\"buildNumber\": \"[0-9]*\"/\"buildNumber\": \"$BUILD_NUM\"/" "$APP_DIR/app.json"

      - name: Strip invisible characters from JS files
        run: |
          node -e '
            const fs = require("fs");
            const files = ["App.js", "src/api.js", "src/theme.js"];
            for (const f of files) {
              if (fs.existsSync(f)) {
                const raw = fs.readFileSync(f, "utf8");
                const clean = raw.replace(/[\u200B-\u200D\uFEFF\u00A0]/g, (m) => m === "\u00A0" ? " " : "");
                fs.writeFileSync(f, clean, "utf8");
                console.log("Cleaned:", f);
              }
            }
          '
        working-directory: ${{ env.APP_DIR }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/Library/Caches/CocoaPods
          key: ios-npm-pods-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: ios-npm-pods-${{ runner.os }}-

      - name: Install packages
        run: |
          npm install --legacy-peer-deps
          npx expo install expo-updates
        working-directory: ${{ env.APP_DIR }}

      - name: Generate iOS project
        env:
          EXPO_UPDATES_CHANNEL: production
        run: npx expo prebuild --platform ios --no-install
        working-directory: ${{ env.APP_DIR }}

      - name: Install CocoaPods
        run: pod install --repo-update
        working-directory: ${{ env.APP_DIR }}/ios

      - name: Configure Apple App Store Signing Certificate & Provisioning Profile
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -n "$IOS_P12_BASE64" ] && [ -n "$IOS_PROVISION_BASE64" ]; then
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
            KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
            CERTIFICATE_PATH=$RUNNER_TEMP/dist_cert.p12
            PP_PATH=$RUNNER_TEMP/profile.mobileprovision

            echo "$IOS_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
            echo "$IOS_PROVISION_BASE64" | base64 --decode > "$PP_PATH"

            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERTIFICATE_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH"

            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< $(security cms -D -i "$PP_PATH"))
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< $(security cms -D -i "$PP_PATH"))
            TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /dev/stdin <<< $(security cms -D -i "$PP_PATH"))
            BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /dev/stdin <<< $(security cms -D -i "$PP_PATH") | sed "s/^${TEAM_ID}\.//")

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

            echo "SIGN_READY=true" >> "$GITHUB_ENV"
            echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
            echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
            echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
            echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
            echo "Loaded Provisioning Profile: $PROFILE_NAME ($PROFILE_UUID) for Team $TEAM_ID ($BUNDLE_ID)"
          else
            echo "SIGN_READY=false" >> "$GITHUB_ENV"
            echo "Apple signing secrets not set — exporting unsigned .ipa."
          fi

      - name: Archive & Export iOS App Store IPA
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          ARCHIVE_PATH="$RUNNER_TEMP/${SCHEME}.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/export"

          if [ "$SIGN_READY" = "true" ]; then
            xcodebuild -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$ARCHIVE_PATH" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CODE_SIGN_STYLE="Manual" \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
              archive

            cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

            xcodebuild -exportArchive \
              -archivePath "$ARCHIVE_PATH" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -exportPath "$EXPORT_PATH"
          else
            xcodebuild -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$ARCHIVE_PATH" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive

            mkdir -p "$EXPORT_PATH/Payload"
            cp -r "$ARCHIVE_PATH/Products/Applications/"*.app "$EXPORT_PATH/Payload/"
            (cd "$EXPORT_PATH" && zip -qry "${SCHEME}-unsigned.ipa" Payload)
          fi

      - name: Publish EAS OTA Update (iOS)
        if: env.EXPO_TOKEN != ''
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest update --platform ios --channel production --message "OTA iOS Build ${{ github.run_number }}" --non-interactive
        working-directory: ${{ env.APP_DIR }}

      - name: Prepare Release IPA
        run: |
          mkdir -p release-ipa
          IPA_SRC=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          [ -z "$IPA_SRC" ] && { echo "No .ipa found!"; exit 1; }
          cp "$IPA_SRC" "release-ipa/iHR-v1.1.0-${{ github.run_number }}.ipa"
          ls -lh release-ipa/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iHR-v1.1.0-${{ github.run_number }}-ios-ipa
          path: release-ipa/iHR-v1.1.0-${{ github.run_number }}.ipa

      - name: Publish iOS IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.1.0-${{ github.run_number }}"
          name: "iHR Build v1.1.0 #${{ github.run_number }}"
          body: "iHR Build v1.1.0: Android APK & iOS App Store IPA."
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-ipa/iHR-v1.1.0-${{ github.run_number }}.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
