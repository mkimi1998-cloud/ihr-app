          };
          export const themes = { light, dark };

          export function buildTheme(scheme = 'light', colorId = 'terracotta') {
            const base = scheme === 'dark' ? dark : light;
            const found = COLOR_THEMES.find((t) => t.id === colorId) || COLOR_THEMES[0];
