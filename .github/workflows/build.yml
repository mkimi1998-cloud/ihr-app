name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ihr-app.zip
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm install
        working-directory: ihr-app
      - run: npx expo install --fix
        working-directory: ihr-app
      - run: npx expo prebuild -p android --no-install
        working-directory: ihr-app
      - run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
        working-directory: ihr-app/android
      - uses: actions/upload-artifact@v4
        with:
          name: iHR-apk
          path: ihr-app/android/app/build/outputs/apk/release/*.apk
