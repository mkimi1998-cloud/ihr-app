            accent: '#FDC107', navy: '#A9BBEA', pill: '#2B3245',
            ok: '#7FD6A0', okBg: '#16301F', okLine: '#2C5A40', bad: '#FFB4AB', badBg: '#3C1F1D', badLine: '#6B2E2A',
