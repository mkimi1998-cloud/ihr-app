                 );
              } else if (legacyMethod) {
                 const methodName = legacyMethod === 'qr' ? 'Imbas QR' : 'Geo Tagging';
                 Alert.alert(
                   `Maklumat ${title}`, 
                   `Kaedah: ${methodName}\nMasa: ${timeVal}\n\n*Lokasi terperinci tidak ditemui untuk sesi ini.*`
                 );
              } else {
                 Alert.alert(
                   `Maklumat ${title}`, 
                   `Masa: ${timeVal}\n\nRekod ini daripada pelayan web. Maklumat lokasi peranti tidak tersedia.`
                 );
              }
            };
            
            const ring = data ? colorOf(data.att_color, C.accent) : C.accent;
            
            return (
              <ScrollView contentContainerStyle={{ paddingBottom: 28 }}>
                <View style={s.dashTop}>
                  <View style={{ flexDirection: 'row', alignItems: 'center', gap: 8 }}>
                    <View style={{ backgroundColor: '#fff', borderRadius: 8, padding: 2 }}>
                       <Image source={require('./assets/icon.png')} style={{ width: 36, height: 36 }} resizeMode="contain" />
                    </View>
                    <Text style={{ color: C.ink, fontSize: 32, fontWeight: '800', letterSpacing: 0.5 }}>iHR Kehadiran</Text>
                  </View>
                  <View style={{ alignItems: 'flex-end' }}>
                    <Pressable onPress={handleLogout} style={s.status}>
                      <View style={[s.dot, { backgroundColor: online == null ? C.mute : online ? C.ok : C.bad }]} />
                      <Text style={s.statusT}>{online == null ? 'Menyemak…' : online ? `Online` : 'Offline'}</Text>
                    </Pressable>
                    <View style={{ flexDirection: 'row', gap: 6, marginTop: 8 }}>
                      <Pressable onPress={() => changeTheme(themeMode === 'dark' ? 'light' : 'dark')} hitSlop={10} style={{ paddingHorizontal: 8, paddingVertical: 6, flexDirection: 'row', alignItems: 'center', backgroundColor: C.field, borderRadius: 14, borderWidth: 1, borderColor: C.line }}>
                        <MaterialIcons name={themeMode === 'dark' ? 'light-mode' : 'dark-mode'} size={15} color={C.primaryText} />
                      </Pressable>
                      <Pressable onPress={load} disabled={busy} hitSlop={10} style={{ paddingHorizontal: 10, paddingVertical: 6, flexDirection: 'row', alignItems: 'center', backgroundColor: C.field, borderRadius: 14, borderWidth: 1, borderColor: C.line }}>
                        {busy ? <ActivityIndicator size="small" color={C.primaryText} /> : (
                          <>
                            <MaterialIcons name="sync" size={16} color={C.primaryText} />
                            <Text style={{ fontSize: 12, color: C.primaryText, fontWeight: '700', marginLeft: 4 }}>Refresh</Text>
                          </>
                        )}
                      </Pressable>
                    </View>
                  </View>
                </View>
                <View style={s.profile}>
                  <Text style={{ fontSize: 11, color: C.primary, fontWeight: '700', marginTop: 2, textTransform: 'uppercase', letterSpacing: 0.4 }}>
                      {now.toLocaleDateString('ms-MY', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}
                    </Text>
                  <View style={{ alignItems: 'center', backgroundColor: C.card, paddingVertical: 8, paddingHorizontal: 16, borderRadius: 14, borderWidth: 1, borderColor: C.line, marginBottom: 12 }}>
                    <Text style={{ fontSize: 12, fontWeight: '800', color: C.ink, letterSpacing: 0.5, fontVariant: ['tabular-nums'] }}>
                      {now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}
                    </Text>
                  </View>
                  <Pressable onLongPress={() => Alert.alert('Medan data pelayan', data ? `${Object.keys(data).join(', ')}\n\nstaff_data: ${Object.keys(sd).join(', ') || '-'}\n\nGambar: ${photo ? 'dijumpai' : 'tiada'}` : 'Tiada data')}>
                    <View style={[s.ring, { borderColor: ring }]}><View style={s.ringIn}>
                      {photo && !badPhoto ? <Image source={photo.startsWith('data:') ? { uri: photo } : { uri: photo, headers: { imei: String(deviceId()) } }} style={s.ringImg} resizeMode="cover" onError={() => setBadPhoto(true)} /> : <Text style={s.ringT}>{name.trim()[0]?.toUpperCase() || 'I'}</Text>}
                    </View></View>
                  </Pressable>
                  <View style={s.pNameBox}>
                    <Text style={{ color: C.mute, fontSize: 16, fontWeight: '700', marginBottom: 4 }}>{greeting},</Text>
                    {wrapName(name).map((l, i) => <Text key={i} style={s.pName} numberOfLines={1}>{l}</Text>)}
                  </View>
                  <View style={s.chips}>
                    <View style={s.chip}><Text style={s.chipT}>No. staff {sd.staff_no ?? sess.staff_no}</Text></View>
                  </View>
                  {data ? <View style={[s.pill, { display: 'none' }]}><Text style={s.pillT}>{data.msg?.clock_in || 'Belum ada rekod waktu masuk hari ini.'}</Text></View> : null}
                </View>
                
                <View style={{ paddingHorizontal: 16, gap: 14 }}>
                  <View style={s.statRow}>
                    <Stat icon="📍" label="Waktu Masuk" value={first || '—'} tint={C.primary} methodIcon={firstM ? getMethodIcon(firstM) : null} onPress={() => showTagInfo('Waktu Masuk', true)} />
                    <Stat icon="📌" label="Waktu Keluar" value={last || '—'} tint={C.navy} methodIcon={lastM ? getMethodIcon(lastM) : null} onPress={() => showTagInfo('Waktu Keluar', false)} />
                  </View>
                  <QuickActionBar go={go} />
                  <WeeklySummaryCard tags={tags} todayFirst={first} todayLast={last} />
                  
                  <Err msg={err} />
                  {busy && !data ? <ActivityIndicator color={C.primaryText} /> : null}
                </View>
                
                <View style={{ marginTop: 32, marginBottom: 10, alignItems: 'center' }}>
                  <Text style={{ color: C.mute, fontSize: 12, fontWeight: '600' }}>Copyright © 2026 MTIB</Text>
                </View>
              </ScrollView>
            );
          }
          
          function useFix() {
            const [fix, setFix] = useState(null); const [err, setErr] = useState('');
            const get = useCallback(async () => {
              setErr('');
              const p = await Location.requestForegroundPermissionsAsync();
              if (p.status !== 'granted') return setErr('Tiada akses lokasi');
              try { const l = await Location.getCurrentPositionAsync({ accuracy: Location.Accuracy.High }); setFix(l.coords); }
              catch { setErr('Peranti tidak dapat mengesan lokasi anda'); }
            }, []);
            useEffect(() => { get(); }, [get]);
            return { fix, err, get, setFix };
          }
          
          const Loc = ({ fix, err, get }) => {
            const { C } = useT(); const [open, setOpen] = useState(false);
            const summary = fix ? `${fix.latitude.toFixed(5)}, ${fix.longitude.toFixed(5)} · ± ${Math.round(fix.accuracy || 0)} m` : (err || 'Mengesan lokasi…');
            return (
              <Collapse title="Lokasi semasa" icon="🛰" tint={C.navy} summary={summary} warn={!fix && !!err} open={open} onToggle={() => setOpen(!open)}>
                {fix ? <>
                  <Row icon="🧭" k="Latitud" v={fix.latitude.toFixed(6)} tint={C.navy} />
                  <Row icon="🧭" k="Longitud" v={fix.longitude.toFixed(6)} tint={C.navy} />
                  <Row icon="🎯" k="Ketepatan" v={`± ${Math.round(fix.accuracy || 0)} m`} tint={C.primary} last /></>
                  : <Text style={{ color: C.mute }}>{err || 'Mengesan lokasi…'}</Text>}
                <Err msg={fix ? '' : err} />
                <Btn kind="ghost" icon="🔄" label="Kesan semula" onPress={get} />
              </Collapse>
            );
          };
          const QuickActionBar = ({ go }) => {
            const { C } = useT();
            const items = [
              { id: 'qr', label: 'Imbas QR', icon: 'qr-code-2' },
              { id: 'geo', label: 'Geo Tagging', icon: 'location-on' },
              { id: 'history', label: 'Log Kehadiran', icon: 'access-time' },
              { id: 'profile', label: 'Profil', icon: 'person-outline' },
            ];
            return (
              <View style={{ flexDirection: 'row', justifyContent: 'space-between', paddingHorizontal: 4, marginVertical: 6 }}>
                {items.map((item) => (
                  <Pressable
                    key={item.id}
                    onPress={() => go(item.id)}
                    style={({ pressed }) => [{ alignItems: 'center', flex: 1 }, pressed && { opacity: 0.7 }]}
                  >
                    <View style={{
                      width: 62,
                      height: 62,
                      borderRadius: 20,
                      backgroundColor: C.primarySoft || '#F8E5E1',
                      alignItems: 'center',
                      justifyContent: 'center',
                      borderWidth: 1,
                      borderColor: (C.line || '#E0D0CC') + '80',
                      marginBottom: 8,
                      shadowColor: '#000',
                      shadowOpacity: 0.04,
                      shadowRadius: 4,
                      elevation: 1,
                    }}>
                      <MaterialIcons name={item.icon} size={28} color={C.primary} />
                    </View>
                    <Text style={{ fontSize: 12, fontWeight: '700', color: C.ink, textAlign: 'center' }}>
                      {item.label}
                    </Text>
                  </Pressable>
                ))}
              </View>
            );
          };
          const attKey = (s) => {
            const p = String(s || '').split(/[-/.]/);
            if (p.length !== 3) return null;
            const d = +p[0], m = +p[1], y = +p[2];
            if (!d || !m || y < 1000) return null;
            return y * 10000 + m * 100 + d;
          };
          const mergeAttendance = (oldRows, newRows, keepDays = 400) => {
            const map = new Map();
            [...oldRows, ...newRows].forEach((r) => { const k = attKey(r && r.date); if (k) map.set(k, r); });
            const c = new Date(); c.setDate(c.getDate() - keepDays);
            const cutKey = c.getFullYear() * 10000 + (c.getMonth() + 1) * 100 + c.getDate();
            return [...map.entries()].filter(([k]) => k >= cutKey).sort((a, b) => b[0] - a[0]).map(([, r]) => r);
          };
          const WeeklySummaryCard = ({ tags = [], todayFirst = null, todayLast = null }) => {
            const { C, s } = useT();
            const [selectedDay, setSelectedDay] = useState(null);
            const [showMonthModal, setShowMonthModal] = useState(false);
            const [serverRows, setServerRows] = useState([]);
            const today = new Date();
            const currentYear = today.getFullYear();
            const currentMonth = today.getMonth();
            const monthNames = [
              'Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun',
              'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'
            ];
            const dayNames = ['Ahd', 'Isn', 'Sel', 'Rab', 'Kha', 'Jum', 'Sab'];
            const fullDayNames = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
            useEffect(() => {
              const fetchServerData = async () => {
                try {
                  const stored = await SecureStore.getItemAsync('SYNCED_SERVER_ATTENDANCE');
                  if (stored) {
                    const parsed = JSON.parse(stored);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                      setServerRows(parsed);
                    }
                  }
                } catch (_) {}
              };
              fetchServerData();
              const timer = setInterval(fetchServerData, 20000);
              return () => clearInterval(timer);
            }, []);
            const parseTimeStr = (str) => {
              if (!str || str === '—' || str === '-') return null;
              const m = /(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?/i.exec(String(str).trim());
              if (!m) return null;
              let hr = +m[1];
              const mn = +m[2];
              const ampm = m[3] ? m[3].toUpperCase() : null;
              if (ampm === 'PM' && hr < 12) hr += 12;
              if (ampm === 'AM' && hr === 12) hr = 0;
              return { hr, mn, totalMins: hr * 60 + mn };
            };
            const buildDay = (d) => {
              const dayIdx = d.getDay();
              const isToday = d.toDateString() === today.toDateString();
              const isPast = d <= today;
              const isWeekend = dayIdx === 0 || dayIdx === 6;
              const dateFormatted = `${d.getDate()} ${monthNames[d.getMonth()].slice(0, 3)} ${d.getFullYear()}`;
              let hours = 0;
              let status = 'tiada';
              let inTime = '—';
              let outTime = '—';
              let notes = '';
              let hasServerMatch = false;
              if (serverRows.length > 0) {
                const matched = serverRows.find((r) => {
                  const parts = String(r.date || '').trim().split(/[-/.]/);
                  if (parts.length === 3) {
                    let rD = 0, rM = 0, rY = 0;
                    if (parts[0].length === 4) {
                      rY = +parts[0]; rM = +parts[1]; rD = +parts[2];
                    } else {
                      rD = +parts[0]; rM = +parts[1]; rY = +parts[2];
                    }
                    return rD === d.getDate() && rM === (d.getMonth() + 1) && rY === d.getFullYear();
                  }
                  return false;
                });
                if (matched) {
                  hasServerMatch = true;
                  inTime = matched.clockIn ? matched.clockIn : (isToday && todayFirst ? todayFirst : '—');
                  outTime = matched.clockOut ? matched.clockOut : (isToday && todayLast ? todayLast : '—');
                  notes = matched.notes || '';
                  if (inTime !== '—') {
                    const parsedIn = parseTimeStr(inTime);
                    if (parsedIn) {
                      const isLate = parsedIn.hr > 9 || (parsedIn.hr === 9 && parsedIn.mn > 0);
                      status = isLate ? 'lewat' : 'tepat';
                    } else {
                      status = 'tepat';
                    }
                    if (outTime !== '—') {
                      const parsedOut = parseTimeStr(outTime);
                      if (parsedIn && parsedOut) {
                        const diffMins = parsedOut.totalMins - parsedIn.totalMins;
                        hours = diffMins > 0 ? parseFloat((diffMins / 60).toFixed(1)) : 8.0;
                      } else {
                        hours = 8.0;
                      }
                    } else {
                      hours = isToday ? 8.0 : 8.0;
                    }
                  } else if (notes && /outdoor|kerja luar|cuti|mesyuarat/i.test(notes)) {
                    inTime = 'Tugasan';
                    outTime = notes;
                    hours = 8.0;
                    status = 'tepat';
                  } else {
                    status = 'tiada';
                    hours = 0;
                  }
                }
              }
              if (!hasServerMatch && isToday && todayFirst) {
                inTime = todayFirst;
                outTime = todayLast || todayFirst;
                status = 'tepat';
                hours = 8.0;
                const parsedIn = parseTimeStr(todayFirst);
                if (parsedIn && (parsedIn.hr > 9 || (parsedIn.hr === 9 && parsedIn.mn > 0))) {
                  status = 'lewat';
                }
                if (todayLast && todayLast !== todayFirst) {
                  const parsedOut = parseTimeStr(todayLast);
                  if (parsedIn && parsedOut) {
                    const diffMins = parsedOut.totalMins - parsedIn.totalMins;
                    hours = diffMins > 0 ? parseFloat((diffMins / 60).toFixed(1)) : 8.0;
                  }
                }
              }
              return {
                dayLabel: dayNames[dayIdx],
                fullDay: fullDayNames[dayIdx],
                dateStr: dateFormatted,
                dayNumber: d.getDate(),
                hours,
                status,
                inTime,
                outTime,
                notes,
                isToday,
                synced: hasServerMatch,
              };
            };
            const currentDayOfWeek = today.getDay();
            const startOfWeek = new Date(today);
            startOfWeek.setDate(today.getDate() - currentDayOfWeek);
            const weekDays = [];
            let tepatCount = 0;
            let lewatCount = 0;
            let tiadaCount = 0;
            let totalWeekHours = 0;
            for (let i = 0; i < 7; i++) {
              const d = new Date(startOfWeek);
              d.setDate(startOfWeek.getDate() + i);
              const item = buildDay(d);
              if (item.status === 'tepat') tepatCount++;
              else if (item.status === 'lewat') lewatCount++;
              else tiadaCount++;
              if (item.hours > 0) totalWeekHours += item.hours;
              weekDays.push(item);
            }
            const daysInCurrentMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const currentMonthDays = [];
            let mMonthTepat = 0, mMonthLewat = 0, mMonthTiada = 0;
            for (let dayNum = daysInCurrentMonth; dayNum >= 1; dayNum--) {
              const item = buildDay(new Date(currentYear, currentMonth, dayNum, 12, 0, 0));
              if (item.status === 'tepat') mMonthTepat++;
              else if (item.status === 'lewat') mMonthLewat++;
              else mMonthTiada++;
              currentMonthDays.push(item);
            }
            const maxBarHeight = 85;
            const maxVal = Math.max(...weekDays.map((w) => w.hours), 9.0);
            const avgHours = (totalWeekHours / (tepatCount + lewatCount || 1)).toFixed(1);
            return (
              <View style={{
                backgroundColor: C.card,
                borderRadius: 24,
                padding: 18,
                borderWidth: 1,
                borderColor: C.line,
                elevation: 3,
                shadowColor: '#000',
                shadowOpacity: 0.06,
                shadowRadius: 10,
              }}>
                <View style={{ flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
                  <Pressable onPress={() => setShowMonthModal(true)} hitSlop={8} style={{ flexDirection: 'row', alignItems: 'center', gap: 6 }}>
                    <Text style={{ fontSize: 18, fontWeight: '800', color: C.ink, letterSpacing: -0.3 }}>
                      Prestasi 7 Hari
                    </Text>
                    <View style={{ backgroundColor: C.primarySoft || '#F8E5E1', paddingHorizontal: 7, paddingVertical: 2, borderRadius: 8 }}>
                      <Text style={{ fontSize: 11, fontWeight: '800', color: C.primary }}>Live</Text>
                    </View>
                  </Pressable>
                  <Pressable
                    onPress={() => setShowMonthModal(true)}
                    style={({ pressed }) => [{
                      flexDirection: 'row',
                      alignItems: 'center',
                      backgroundColor: C.field,
                      paddingHorizontal: 11,
                      paddingVertical: 6,
                      borderRadius: 14,
                      borderWidth: 1,
                      borderColor: C.line,
                      gap: 4,
                    }, pressed && { opacity: 0.7 }]}
                  >
                    <MaterialIcons name="calendar-today" size={14} color={C.primary} />
                    <Text style={{ color: C.ink, fontWeight: '700', fontSize: 12 }}>
                      {`${monthNames[currentMonth]} ${currentYear}`}
                    </Text>
                    <MaterialIcons name="chevron-right" size={16} color={C.mute} />
                  </Pressable>
                </View>
                <View style={{
                  flexDirection: 'row',
                  alignItems: 'flex-end',
                  justifyContent: 'space-between',
                  height: 145,
                  paddingTop: 10,
                  paddingHorizontal: 2,
                }}>
                  {weekDays.map((item, idx) => {
                    const fillPercent = item.hours > 0 ? Math.min(item.hours / maxVal, 1.0) : 0;
                    const barFillHeight = item.hours > 0 ? Math.max(fillPercent * maxBarHeight, 18) : 0;
                    const barColor = item.status === 'tepat' ? C.primary : item.status === 'lewat' ? '#D97706' : 'transparent';
                    return (
                      <Pressable
                        key={idx}
                        onPress={() => setSelectedDay(item)}
                        style={({ pressed }) => [{
                          alignItems: 'center',
                          flex: 1,
                        }, pressed && { opacity: 0.6 }]}
                      >
                        <Text style={{
                          fontSize: 10,
                          fontWeight: '800',
                          color: item.hours > 0 ? C.ink : 'transparent',
                          marginBottom: 6,
                        }}>
                          {item.hours > 0 ? `${item.hours}j` : '-'}
                        </Text>
                        <View style={{
                          width: 34,
                          height: maxBarHeight,
                          backgroundColor: item.isToday ? (C.primarySoft || '#F8E5E1') : C.field,
                          borderRadius: 12,
                          justifyContent: 'flex-end',
                          alignItems: 'center',
                          borderWidth: item.isToday ? 1.5 : 1,
                          borderColor: item.isToday ? C.primary : C.line,
                          overflow: 'hidden',
                          padding: 2,
                        }}>
                          {barFillHeight > 0 ? (
                            <View style={{
                              width: '100%',
                              height: barFillHeight,
                              backgroundColor: barColor,
                              borderRadius: 10,
                            }} />
                          ) : (
                            <View style={{
                              width: 6,
                              height: 6,
                              borderRadius: 3,
                              backgroundColor: C.line,
                              marginBottom: 6,
                            }} />
                          )}
                        </View>
                        <View style={{ alignItems: 'center', marginTop: 8 }}>
                          <Text style={{
                            fontSize: 11,
                            fontWeight: item.isToday ? '800' : '600',
                            color: item.isToday ? C.primary : C.ink,
                          }}>
                            {item.dayLabel}
                          </Text>
                          <Text style={{
                            fontSize: 9,
                            color: item.isToday ? C.primary : C.mute,
                            fontWeight: item.isToday ? '800' : '500',
                            marginTop: 1,
                          }}>
                            {item.dayNumber}
                          </Text>
                        </View>
                      </Pressable>
                    );
                  })}
                </View>
                <View style={{ height: 1, backgroundColor: C.line, marginVertical: 14, opacity: 0.6 }} />
                <Pressable onPress={() => setShowMonthModal(true)} style={{ flexDirection: 'row', justifyContent: 'space-between', alignItems: 'center', paddingHorizontal: 6 }}>
                  <View style={{ flexDirection: 'row', alignItems: 'center', gap: 6 }}>
                    <View style={{ width: 8, height: 8, borderRadius: 4, backgroundColor: C.primary }} />
                    <Text style={{ fontSize: 13, fontWeight: '800', color: C.ink }}>{tepatCount} <Text style={{ fontSize: 11, fontWeight: '600', color: C.mute }}>Tepat</Text></Text>
                  </View>
                  <View style={{ flexDirection: 'row', alignItems: 'center', gap: 6 }}>
                    <View style={{ width: 8, height: 8, borderRadius: 4, backgroundColor: '#D97706' }} />
                    <Text style={{ fontSize: 13, fontWeight: '800', color: '#D97706' }}>{lewatCount} <Text style={{ fontSize: 11, fontWeight: '600', color: C.mute }}>Lewat</Text></Text>
                  </View>
                  <View style={{ flexDirection: 'row', alignItems: 'center', gap: 6 }}>
                    <MaterialIcons name="timelapse" size={14} color={C.primary} />
                    <Text style={{ fontSize: 13, fontWeight: '800', color: C.ink }}>{avgHours}j <Text style={{ fontSize: 11, fontWeight: '600', color: C.mute }}>Purata</Text></Text>
                  </View>
                </Pressable>
                <Modal visible={!!selectedDay} transparent animationType="fade" onRequestClose={() => setSelectedDay(null)}>
                  <View style={{ flex: 1, backgroundColor: 'rgba(0,0,0,0.65)', justifyContent: 'center', alignItems: 'center', padding: 20 }}>
                    <View style={{
                      backgroundColor: C.card,
                      borderRadius: 24,
                      width: '100%',
                      maxWidth: 360,
                      padding: 22,
                      borderWidth: 1.5,
                      borderColor: C.line,
                      shadowColor: '#000',
                      shadowOpacity: 0.2,
                      shadowRadius: 16,
                      elevation: 8,
                    }}>
                      <View style={{ flexDirection: 'row', justifyContent: 'space-between', alignItems: 'center', borderBottomWidth: 1, borderBottomColor: C.line, paddingBottom: 14 }}>
                        <View>
                          <Text style={{ fontSize: 20, fontWeight: '800', color: C.ink }}>{selectedDay?.fullDay}</Text>
                          <Text style={{ fontSize: 13, color: C.mute, marginTop: 2 }}>{selectedDay?.dateStr}</Text>
                        </View>
                        <View style={{
                          paddingHorizontal: 12,
                          paddingVertical: 5,
                          borderRadius: 12,
                          backgroundColor: selectedDay?.status === 'tepat' ? '#E8F5E9' : selectedDay?.status === 'lewat' ? '#FEF3C7' : C.field,
                          borderWidth: 1,
                          borderColor: selectedDay?.status === 'tepat' ? '#A7F3D0' : selectedDay?.status === 'lewat' ? '#FDE68A' : C.line
                        }}>
                          <Text style={{
                            fontSize: 12,
                            fontWeight: '800',
                            color: selectedDay?.status === 'tepat' ? '#2E7D4F' : selectedDay?.status === 'lewat' ? '#D97706' : C.mute
                          }}>
                            {selectedDay?.status === 'tepat' ? 'Tepat Masa' : selectedDay?.status === 'lewat' ? 'Lewat' : 'Tiada Rekod'}
                          </Text>
                        </View>
                      </View>
                      <View style={{ flexDirection: 'row', gap: 12, marginVertical: 18 }}>
                        <View style={{
