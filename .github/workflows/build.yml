name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
env:
  APP_VERSION: "1.1.0"
  VERSION_CODE: "2"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ihr-app.zip
      - run: |
          jq --arg v "$APP_VERSION" --argjson c "$VERSION_CODE" '.expo.version=$v | .expo.android.versionCode=$c' app.json > app.tmp && mv app.tmp app.json
          sed -i "s/versi 1\.1\.0/versi $APP_VERSION/" src/screens/ProfileScreen.js
        working-directory: ihr-app
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm pkg set dependencies.expo-font="~12.0.10"
        working-directory: ihr-app
      - run: npm install
        working-directory: ihr-app
      - run: npx expo install --fix
        working-directory: ihr-app
      - run: npx expo prebuild -p android --no-install
        working-directory: ihr-app
      - run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
        working-directory: ihr-app/android
      - uses: actions/upload-artifact@v4
        with:
          name: iHR-apk
          path: ihr-app/android/app/build/outputs/apk/release/*.apk
